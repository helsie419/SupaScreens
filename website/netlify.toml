
[[redirects]]
  from = "/products"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/contac-us"
  to = "/contact.html"
  status = 301
  force = true

[[redirects]]
  from = "/contac-us/"
  to = "/contact.html"
  status = 301
  force = true

[[redirects]]
  from = "/wp-json/*"
  to = "/"
  status = 404

[[redirects]]
  from = "/xmlrpc.php"
  to = "/"
  status = 404

[[redirects]]
  from = "/feed/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/comments/*"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
    Content-Usage = "train-ai=n, search=y"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
